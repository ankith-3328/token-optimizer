[project]
name = "token-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "tiktoken",
    "sentence-transformers",
    "numpy",
    "python-dotenv",
    "pytest",
    "ollama",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
