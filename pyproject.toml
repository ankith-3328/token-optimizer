[project]
name = "token-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2,<3.0",
    "transformers>=4.40,<5.0",
    "tiktoken>=0.6",
    "sentence-transformers>=2.7",
    "numpy>=1.26,<3.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
