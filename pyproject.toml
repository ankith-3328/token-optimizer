[project]
name = "token-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=5.6.1",
    "ollama>=0.5.1",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
